<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>작업물 목록 - 나의 포트폴리오</title>
<link rel="stylesheet" href="style.css">
<style>
  .page { max-width: 480px; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    background: #f6fbfa;
  }
  li.done { opacity: 0.55; }
  li .checkbox { flex-shrink: 0; width: 18px; height: 18px; accent-color: var(--primary); }
  li .content { flex: 1; min-width: 0; }
  li .title { font-weight: 600; color: var(--text); }
  li.done .title { text-decoration: line-through; }
  li .meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  li .amount {
    flex-shrink: 0;
    font-size: 0.85rem;
    color: var(--accent-blue-dark);
    font-weight: 600;
    background: #e7f1fa;
    padding: 2px 10px;
    border-radius: 999px;
  }
  #status { color: var(--text-muted); }
</style>
</head>
<body>
<div class="page">
<h1>작업물 목록</h1>
<a class="home-link" href="index.html">← 홈으로 돌아가기</a>
<p class="lead" style="margin-bottom: 12px;">Supabase 연동 연습용 데이터(test_todos)를 불러와 보여주는 예시 페이지입니다. 실제 작업물 데이터로 교체될 예정입니다.</p>
<p id="status">불러오는 중...</p>
<ul id="todo-list"></ul>

<script>
  const SUPABASE_URL = "https://sckaxhkmiskfvvkyycli.supabase.co/rest/v1/";
  const SUPABASE_ANON_KEY = "sb_publishable_GP73LVQtHJYuB6dB13KmXQ_jGZDB_2Q";

  async function loadTodos() {
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("todo-list");

    try {
      const res = await fetch(SUPABASE_URL + "test_todos?select=*", {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        }
      });

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const todos = await res.json();

      if (todos.length === 0) {
        statusEl.textContent = "등록된 항목이 없습니다.";
        return;
      }

      statusEl.remove();
      todos.forEach(todo => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "checkbox";
        checkbox.checked = !!todo.done;
        checkbox.disabled = true;
        li.appendChild(checkbox);

        const content = document.createElement("div");
        content.className = "content";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = todo.title ?? "(제목 없음)";
        content.appendChild(title);

        if (todo.due_date) {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = "마감일: " + todo.due_date;
          content.appendChild(meta);
        }

        li.appendChild(content);

        if (todo.amount !== undefined && todo.amount !== null) {
          const amount = document.createElement("div");
          amount.className = "amount";
          amount.textContent = todo.amount + "개";
          li.appendChild(amount);
        }

        listEl.appendChild(li);
      });
    } catch (err) {
      statusEl.textContent = "불러오기 실패: " + err.message;
    }
  }

  loadTodos();
</script>
</div>
</body>
</html>
